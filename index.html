:root{
  --bg:#F4EBDD; --surface:#FFFCF6; --ink:#1A5B55; --muted:#46706A;
  --line:#DCCFB8; --line-strong:#BFB08F;
  --accent:#1A5B55; --accent-ink:#123F5F; --accent-soft:#DCEBE7; --on-accent:#FFF1E8;
  --warn:#8A4B00; --warn-soft:#FCEBCB; --warn-line:#E5B766;
  --ok:#14673A; --ok-soft:#D9F0E0; --ok-line:#7FC49A;
  --danger:#A12A2A; --danger-soft:#FBE3E1;
  --hatch-a:#EADFCB; --hatch-b:#DFD2B9;
  --shadow:0 12px 36px rgba(10,24,38,.22); --scrim:rgba(14,24,34,.45);
  --font-head:"Be Vietnam Pro","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1816; --surface:#15211F; --ink:#EAF1EE; --muted:#97ABA6;
    --line:#243532; --line-strong:#34504B;
    --accent:#7CC4B8; --accent-ink:#A9D3F2; --accent-soft:#153330; --on-accent:#0A1C19;
    --warn:#F0B45A; --warn-soft:#34270F; --warn-line:#6B501E;
    --ok:#6FD09A; --ok-soft:#112F20; --ok-line:#2D6B47;
    --danger:#F08A85; --danger-soft:#3A1717;
    --hatch-a:#1A2724; --hatch-b:#21312D;
    --shadow:0 12px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1816; --surface:#15211F; --ink:#EAF1EE; --muted:#97ABA6;
  --line:#243532; --line-strong:#34504B;
  --accent:#7CC4B8; --accent-ink:#A9D3F2; --accent-soft:#153330; --on-accent:#0A1C19;
  --warn:#F0B45A; --warn-soft:#34270F; --warn-line:#6B501E;
  --ok:#6FD09A; --ok-soft:#112F20; --ok-line:#2D6B47;
  --danger:#F08A85; --danger-soft:#3A1717;
  --hatch-a:#1A2724; --hatch-b:#21312D;
  --shadow:0 12px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--font-head);font-size:clamp(24px,4vw,32px);line-height:1.15;font-weight:700;text-wrap:balance}
.hours{margin:6px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav h2{margin:0 4px;font-family:var(--font-head);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:11.5ch;text-align:center}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-family:var(--font-head);font-variant-numeric:tabular-nums}

.btn{border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.banner{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);font-size:14px}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-strong);display:inline-block}
.sw.free{border-style:dashed;background:transparent}
.sw.pending{background:var(--warn-soft);border-color:var(--warn-line)}
.sw.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.sw.block{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 4px,var(--hatch-b) 4px 8px)}

.board{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:104px repeat(4,minmax(0,1fr));gap:8px}
.row.head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row.head .gh{grid-column:span 2;display:flex;align-items:baseline;gap:8px;padding:0 2px;color:var(--ink)}
.row.head .gh small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
.row.head.sub>div{padding:0 2px}
.daylabel{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px}
.daylabel b{font-family:var(--font-head);font-weight:600}
.daylabel span{color:var(--muted);font-variant-numeric:tabular-nums}
.daylabel em{font-style:normal;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:1px 8px;border-radius:999px;align-self:flex-start}
.row.is-today .daylabel b{color:var(--accent)}

.cell{min-height:88px;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;
  display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.cell strong{font-weight:600}
.cell .sub{font-size:13px;color:var(--muted)}
.mlabel{display:none;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cell.free{border-style:dashed;border-color:var(--line-strong);background:transparent;color:var(--muted);justify-content:space-between}
.cell.free .plus{font-size:13px;font-weight:600;color:var(--accent);opacity:0}
.cell.free:hover,.cell.free:focus-visible{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cell.free:hover .plus,.cell.free:focus-visible .plus{opacity:1}
.cell.loading{opacity:.6}
.cell.past{background:transparent;border-style:dotted;color:var(--muted);opacity:.7}
.cell.block{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 8px,var(--hatch-b) 8px 16px);border-color:var(--line-strong)}
button.cell.block:hover{border-color:var(--accent)}
.cell.booked.pending{background:var(--warn-soft);border-color:var(--warn-line)}
.cell.booked.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.cell.booked:hover{border-color:var(--accent)}
.pill{align-self:flex-start;margin-top:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
.pending .pill{color:var(--warn)} .ok .pill{color:var(--ok)}

.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:4px;align-self:flex-start;max-width:100%}
.stack{display:flex;flex-direction:column;gap:18px}
.tabs{max-width:340px}
.repbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.repbar .nav h2{min-width:10ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--font-head);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.rep-block{display:flex;flex-direction:column;gap:8px}
.rep-block h3{margin:0;font-family:var(--font-head);font-size:16px;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:11rem}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--bg)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.empty{padding:22px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;margin:0}
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:560px;margin-block:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet h2{margin:0;font-family:var(--font-head);font-size:20px;font-weight:600}
.slot{margin:4px 0 0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1;flex:none}
.seg{display:flex;gap:4px;padding:3px;background:var(--bg);border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:9px 10px}
textarea{resize:vertical}
.err{margin:0;color:var(--danger);font-size:14px;min-height:0}
.err:empty{display:none}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dl.info{margin:0;display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:8px 14px}
dl.info dt{color:var(--muted);font-size:13px;padding-top:1px}
dl.info dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.sect{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.sect h3{margin:0;font-family:var(--font-head);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.head{display:none}
  .daylabel{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px;padding:10px 2px 0;border-top:1px solid var(--line)}
  .mlabel{display:block}
  .grid2{grid-template-columns:minmax(0,1fr)}
  dl.info{grid-template-columns:minmax(0,1fr)} dl.info dt{padding-top:6px}
  .cell.free .plus{opacity:1}
}
@media (prefers-reduced-motion:no-preference){
  .cell,.btn,.icon-btn{transition:background-color .12s,border-color .12s,color .12s}
}

:root{--mu:var(--muted);--sf:var(--surface);--ln:var(--line);--ac:var(--accent);--acs:var(--accent-soft);--wn:var(--warn);--wns:var(--warn-soft);--oks:var(--ok-soft);--dg:var(--danger);--h1:var(--hatch-a);--h2:var(--hatch-b)}

 </div>${edit?`<div class="g2"><label>Đổi ngày<input type="date" name="nd" value="${d}"></label><label>Ca · phòng<select name="ns">${["S1","S2","C1","C2"].map(x=>`<option value="${x}" ${x==s+r?"selected":""}>${SES[x[0]].split(" ")[0]} · ${ROOMS[x[1]]}</option>`).join("")}</select></label></div>`:""}`:""}
 <div class="err" id="fe"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="cx">Đóng</button>
 ${edit&&(admin||b.uid==user.uid)?`<button type="button" class="btn d" id="del">Huỷ lịch</button>`:""}<button class="btn p" id="sv">${edit?"Lưu":"Đặt lịch"}</button></div></form>`;
 const f=$("#f");$("#cx").onclick=()=>dlg.close();
 if(admin){const upd=()=>{const t=f.type.value=="training";$("#dm").hidden=t;$("#ad").hidden=t;$("#tm").hidden=!t};f.type.onchange=upd;
  const auto=()=>{if(f.bs.value)f.label.value=`Đào tạo ${f.bs.value}${f.trainer.value?" ("+f.trainer.value+")":""}`};f.bs.onchange=auto;f.trainer.onchange=auto}
 $("#del")&&($("#del").onclick=async()=>{const bt=$("#del");if(!bt.dataset.arm){bt.dataset.arm="1";bt.textContent="Bấm lại để huỷ lịch";return}try{await call("delete",{id:k});dlg.close()}catch(e){$("#fe").textContent=e.message}});
 f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),g=n=>(fd.get(n)||"").toString().trim(),type=admin?g("type"):"demo";
  let data;if(type=="training"){data={type,code:g("code"),bs:g("bs"),trainer:g("trainer"),label:g("label")||"Lịch đào tạo",uid:b?.uid||user.uid,date:d,session:s,room:+r}}
  else{if(!g("customer")||!g("staff"))return $("#fe").textContent="Nhập tên khách và nhân viên phụ trách.";
   const tm=g("time"),sx=(g("ns")||s+r)[0],lo=sx=="S"?"08:00":"13:30",hi=sx=="S"?"12:00":"17:30";if(tm&&(tm<lo||tm>hi))return $("#fe").textContent=`Giờ hẹn phải nằm trong ${lo}–${hi}.`;
   data={type,...(admin?{code:g("code")}:{}),staff:g("staff"),time:tm,phone:g("phone"),customer:g("customer"),address:g("address"),hasShop:g("hasShop"),needs:fd.getAll("needs"),prep:g("prep"),note:g("note"),
    uid:b?.uid||user.uid,email:b?.email||user.email,status:admin?g("status"):(b?.status||"pending"),date:d,session:s,room:+r};
   if(admin){data.trainer=g("trainer2");data.result=g("result");data.resultNote=g("resultNote")}}
  let nk=k;if(admin&&edit){const ns=g("ns")||s+r;data.date=g("nd")||d;data.session=ns[0];data.room=+ns[1];nk=key(data.date,data.session,data.room)}
  try{await call("save",{id:k,newId:nk,data});dlg.close()}catch(er){$("#fe").textContent=er.message}};
 dlg.showModal()}
function inPer(b){const d=new Date(b.date+"T00:00");return d.getFullYear()==ref.getFullYear()&&(per=="year"||d.getMonth()==ref.getMonth())}
function rows(){return Object.values(B).filter(b=>b.type=="demo"&&inPer(b)).sort((a,b)=>a.date.localeCompare(b.date))}
function by(list,f){const m={};list.forEach(b=>{const n=(f(b)||"(chưa có)").trim();(m[n]??=[]).push(b)});return m}
const FL={staff:"Nhân viên",trainer:"Người đào tạo",status:"Trạng thái",result:"Kết quả"};let flt=null;
const fq=o=>esc(new URLSearchParams(o).toString());
const lk=(n,o)=>n?`<button class="lk" data-f="${fq(o)}">${n}</button>`:n;
const mt=(b,f)=>Object.entries(f).every(([k,v])=>k=="status"?(b.status=="approved"?"approved":"pending")==v:(b[k]||"(chưa có)").toString().trim()==v);
function tbl(title,m,fd){return`<div class="card"><b>${title}</b><table><tr><th></th><th>Tổng</th><th>Đã duyệt</th>${RESULTS.map(r=>`<th>${r}</th>`).join("")}<th>% chốt</th></tr>${Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([n,l])=>{const o={[fd]:n},dn=l.filter(x=>x.result).length,w=l.filter(x=>x.result=="Chốt đơn").length;return`<tr><td>${lk(esc(n),o)}</td><td>${lk(l.length,o)}</td><td>${lk(l.filter(x=>x.status=="approved").length,{...o,status:"approved"})}</td>${RESULTS.map(r=>`<td>${lk(l.filter(x=>x.result==r).length,{...o,result:r})}</td>`).join("")}<td title="Chốt ${w}/${dn} lịch có kết quả"><b>${dn?Math.round(w/dn*100)+"%":"–"}</b></td></tr>`}).join("")||'<tr><td colspan="7" class="mu">Chưa có lịch</td></tr>'}</table></div>`}
function report(){const l=rows(),ap=l.filter(b=>b.status=="approved").length,won=l.filter(b=>b.result=="Chốt đơn").length,dn=l.filter(b=>b.result).length,dl=flt?l.filter(b=>mt(b,flt)):l;
 const kb=(n,t,o)=>`<button type="button" class="kpi ${JSON.stringify(o||null)==JSON.stringify(flt)?"sel":""}" data-f="${fq(o||{})}"><b>${n}</b><span>${t}</span></button>`;
 return`<div class="bar"><div><button class="btn ${per=="month"?"on":""}" data-p="month">Tháng</button> <button class="btn ${per=="year"?"on":""}" data-p="year">Năm</button> <button class="btn" data-r="-1">‹</button> <b>${per=="month"?`${ref.getMonth()+1}/${ref.getFullYear()}`:ref.getFullYear()}</b> <button class="btn" data-r="1">›</button></div><button class="btn p" id="csv">Tải CSV</button></div>
 <div class="kpis">${kb(l.length,"Lịch demo")}${kb(ap,"Đã duyệt",{status:"approved"})}${kb(l.length-ap,"Chờ duyệt",{status:"pending"})}${kb(won,"Chốt đơn",{result:"Chốt đơn"})}<div class="kpi"><b>${dn?Math.round(won/dn*100)+"%":"–"}</b><span>Tỉ lệ chốt (trên ${dn} có kết quả)</span></div></div>
 ${tbl("Theo nhân viên phụ trách",by(l,b=>b.staff),"staff")}${tbl("Theo người đào tạo",by(l,b=>b.trainer),"trainer")}
 <div class="card"><b>Chi tiết (${dl.length})</b> <span class="mu">Bấm một dòng để xem và sửa chi tiết lịch.</span>
 ${flt?`<div class="mu" style="margin:6px 0">Đang lọc: ${Object.entries(flt).map(([k,v])=>FL[k]+" = "+(k=="status"?(v=="approved"?"Đã duyệt":"Chờ duyệt"):esc(v))).join(", ")} · <button class="lk" data-f="">Bỏ lọc</button></div>`:""}
 <table><tr><th>Ngày</th><th>Giờ</th><th>Ca</th><th>Phòng</th><th>Mã</th><th>Khách</th><th>SĐT</th><th>Nhân viên</th><th>Nhu cầu</th><th>Duyệt</th><th>Đào tạo</th><th>Kết quả</th></tr>
 ${dl.map(b=>`<tr class="rw" data-c="${b.id}"><td>${fmt(b.date)}</td><td>${esc(b.time)}</td><td>${b.session=="S"?"Sáng":"Chiều"}</td><td>${ROOMS[b.room]}</td><td>${esc(b.code)}</td><td>${esc(b.customer)}</td><td>${esc(b.phone)}</td><td>${esc(b.staff)}</td><td>${esc((b.needs||[]).map(n=>NA[n]||n).join(", "))}</td><td>${b.status=="approved"?"Đã duyệt":"Chờ"}</td><td>${esc(b.trainer)}</td><td>${esc(b.result)}</td></tr>`).join("")||'<tr><td colspan="12" class="mu">Không có lịch</td></tr>'}</table></div>`}
function csv(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,h=["Ngày","Ca","Phòng","Mã","Khách","SĐT","Nhân viên","Duyệt","Đào tạo","Kết quả","Ghi chú kết quả"];
 const t=[h,...rows().map(b=>[fmt(b.date),b.session=="S"?"Sáng":"Chiều",ROOMS[b.room],b.code,b.customer,b.phone,b.staff,b.status=="approved"?"Đã duyệt":"Chờ duyệt",b.trainer,b.result,b.resultNote])].map(r=>r.map(q).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="bao-cao-demo.csv";a.click()}
if(!API||!CLIENT_ID)A.innerHTML='<div class="card">Chưa cấu hình. Điền <b>API</b> (URL Apps Script /exec) và <b>CLIENT_ID</b> ở đầu phần script của index.html.</div>';
else{if(token)setTok(token);render();setInterval(()=>{const f=document.activeElement;if(user&&!dlg.open&&!lst&&!(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)))call("list").catch(()=>{})},20000)}
</script></body></html>
